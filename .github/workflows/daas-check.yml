name: Daas checks
on:
  push:
    branches: [company-deepseek]
  pull_request:
    branches: [company-deepseek]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:daas
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./start.ps1 --version
